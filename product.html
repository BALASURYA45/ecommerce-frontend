<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product • ShopSmart</title>
    <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
    <header class="site-header" data-header>
        <div class="container header-row">
            <a class="brand" href="index.html" aria-label="ShopSmart Home">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">ShopSmart</span>
            </a>

            <nav class="site-nav" aria-label="Primary navigation" data-nav>
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#products" class="nav-link">Products</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </nav>

            <div class="header-actions">
                <form class="search" role="search" aria-label="Product search">
                    <label class="sr-only" for="search-input">Search products</label>
                    <input id="search-input" class="search-input" type="search" placeholder="Search products..." autocomplete="off" />
                    <button class="search-button" type="submit" aria-label="Search">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm7.7 12.3 2.5 2.5a1 1 0 0 1-1.4 1.4l-2.5-2.5a1 1 0 0 1 1.4-1.4Z"></path>
                        </svg>
                    </button>
                </form>

                <button class="icon-button cart-button" type="button" aria-label="Shopping cart">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M6.2 6.6h15.5a1 1 0 0 1 1 .8l1 5.6a1 1 0 0 1-1 1.2H8.2l.4 2.2h12.6a1 1 0 1 1 0 2H7.9a1 1 0 0 1-1-.8L4.4 4.8H2a1 1 0 1 1 0-2h3.2a1 1 0 0 1 1 .8l.8 3Z"></path>
                        <path d="M9.2 22a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Zm10 0a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Z"></path>
                    </svg>
                    <span class="badge" aria-label="Items in cart">
                        <span id="cart-count">0</span>
                    </span>
                </button>

                <button class="icon-button hamburger" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false" data-hamburger>
                    <span class="hamburger-lines" aria-hidden="true"></span>
                </button>
            </div>
        </div>

        <div id="mobile-menu" class="mobile-menu" data-mobile-menu>
            <div class="container mobile-menu-inner">
                <form class="search search--mobile" role="search" aria-label="Product search (mobile)">
                    <label class="sr-only" for="search-input-mobile">Search products</label>
                    <input id="search-input-mobile" class="search-input" type="search" placeholder="Search products..." autocomplete="off" />
                    <button class="search-button" type="submit" aria-label="Search">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Zm7.7 12.3 2.5 2.5a1 1 0 0 1-1.4 1.4l-2.5-2.5a1 1 0 0 1 1.4-1.4Z"></path>
                        </svg>
                    </button>
                </form>
                <nav class="mobile-nav" aria-label="Mobile navigation">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="index.html#products" class="nav-link">Products</a>
                    <a href="index.html#about" class="nav-link">About</a>
                    <a href="index.html#contact" class="nav-link">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="page">
        <section class="section section--tight">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="index.html#products" class="breadcrumb-link">Products</a>
                    <span class="breadcrumb-sep" aria-hidden="true">/</span>
                    <span class="breadcrumb-current" data-product-breadcrumb>Loading…</span>
                </nav>

                <div class="product-detail" data-product-detail>
                    <div class="product-gallery" aria-label="Product images">
                        <div class="product-main-img-wrap">
                            <img class="product-main-img" alt="" decoding="async" referrerpolicy="no-referrer" data-product-main-img />
                            <div class="zoom-lens" aria-hidden="true" data-zoom-lens></div>
                        </div>
                        <p class="zoom-hint" data-zoom-hint>Hover to zoom • Tap to zoom</p>
                        <div class="product-thumbs" role="list" aria-label="More views" data-product-thumbs></div>
                    </div>

                    <div class="product-info">
                        <div class="product-info-top">
                            <span class="pill pill--soft" data-product-category>—</span>
                            <h1 class="product-detail-title" data-product-title>Loading product…</h1>
                            <p class="product-detail-meta" data-product-rating></p>
                        </div>

                        <div class="product-detail-price-row">
                            <div>
                                <div class="product-detail-price" data-product-price></div>
                                <div class="product-detail-total" aria-label="Total price">
                                    Total: <span data-product-total>—</span>
                                </div>
                            </div>
                            <div class="qty" aria-label="Quantity selector">
                                <button class="qty-btn" type="button" data-qty-dec aria-label="Decrease quantity">−</button>
                                <input class="qty-input" type="number" min="1" value="1" inputmode="numeric" data-qty />
                                <button class="qty-btn" type="button" data-qty-inc aria-label="Increase quantity">+</button>
                            </div>
                        </div>

                        <p class="product-detail-desc" data-product-desc></p>

                        <div class="product-variants" data-product-variants hidden>
                            <label class="select">
                                <span class="variant-label">Size</span>
                                <select data-variant-size></select>
                            </label>
                            <label class="select">
                                <span class="variant-label">Color</span>
                                <select data-variant-color></select>
                            </label>
                        </div>

                        <div class="product-actions">
                            <button class="btn btn--primary btn--lg" type="button" data-add-to-cart>Add to Cart</button>
                            <a class="btn btn--ghost btn--lg" href="index.html#products">Continue shopping</a>
                        </div>

                        <div class="product-detail-status" data-product-status aria-live="polite"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="footer-text">© <span data-year></span> ShopSmart. All rights reserved.</p>
        </div>
    </footer>

    <script src="scripts/product.js"></script>
</body>
</html>
